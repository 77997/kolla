  build-grafana:
    runs-on: ubuntu-latest
    steps:
      - name: Cache grafana deb
        id: cache
        uses: actions/cache@v5
        with:
          path: grafana-deb
          key: grafana-ppc64le-${{ env.GRAFANA_VERSION }}-deb

      - name: Cross-compile Go binaries for ppc64le
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p grafana-deb
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            golang:1.25-trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross make

              git clone --depth 1 --branch v${{ env.GRAFANA_VERSION }} \
                https://github.com/grafana/grafana.git /src

              cd /src
              make gen-go WIRE_TAGS=oss

              VERSION=$(grep "\"version\"" package.json | head -1 | sed "s/.*\": \"\(.*\)\".*/\1/")
              COMMIT=$(git rev-parse --short HEAD)
              BUILDSTAMP=$(date +%s)

              export CGO_ENABLED=1
              export CC=powerpc64le-linux-gnu-gcc
              export GOOS=linux
              export GOARCH=ppc64le

              LDFLAGS="-w -X main.version=${VERSION} -X main.commit=${COMMIT} -X main.buildstamp=${BUILDSTAMP} -X main.buildBranch=v${{ env.GRAFANA_VERSION }}"

              for bin in grafana grafana-server grafana-cli; do
                go build -trimpath -tags oss -ldflags "${LDFLAGS}" -o /output/${bin} ./pkg/cmd/${bin}
              done
            '

      - name: Build frontend
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -w /src \
            -e NODE_OPTIONS=--max_old_space_size=4096 \
            -e NODE_ENV=production \
            node:22 \
            bash -c '
              set -ex
              corepack enable
              YARN_ENABLE_PROGRESS_BARS=false yarn install --immutable
              yarn run build
            '

      - name: Package with FPM
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          VERSION=$(grep '"version"' grafana-src/package.json | head -1 | sed 's/.*": "\(.*\)".*/\1/')
          docker run --rm \
            -v "${{ github.workspace }}/grafana-src:/src" \
            -v "${{ github.workspace }}/grafana-deb:/output" \
            -e VERSION="${VERSION}" \
            ruby:3.2.2-bullseye \
            bash -c '
              set -ex
              gem install fpm
              apt-get update && apt-get install -y --no-install-recommends rpm

              mkdir -p /pkg/usr/sbin /pkg/usr/share /pkg/etc/grafana \
                       /pkg/usr/lib/systemd/system /pkg/etc/init.d /pkg/etc/default

              cp /src/packaging/wrappers/grafana-server /pkg/usr/sbin/
              cp /src/packaging/wrappers/grafana-cli /pkg/usr/sbin/
              chmod +x /pkg/usr/sbin/grafana-server /pkg/usr/sbin/grafana-cli

              mkdir -p /pkg/usr/share/grafana/bin
              cp /output/grafana /output/grafana-server /output/grafana-cli \
                /pkg/usr/share/grafana/bin/
              cp -r /src/public /pkg/usr/share/grafana/public
              cp -r /src/conf /pkg/usr/share/grafana/conf
              cp /src/LICENSE /src/NOTICE.md /pkg/usr/share/grafana/ 2>/dev/null || true
              echo "${VERSION}" > /pkg/usr/share/grafana/VERSION

              cp /src/packaging/deb/systemd/grafana-server.service /pkg/usr/lib/systemd/system/
              cp /src/packaging/deb/init.d/* /pkg/etc/init.d/ 2>/dev/null || true
              cp /src/packaging/deb/default/* /pkg/etc/default/ 2>/dev/null || true

              cp /src/conf/defaults.ini /pkg/etc/grafana/grafana.ini
              cp /src/conf/ldap.toml /pkg/etc/grafana/ldap.toml

              cd /pkg
              fpm \
                --input-type dir \
                --output-type deb \
                --name grafana \
                --version ${VERSION} \
                --architecture ppc64el \
                --vendor "Grafana Labs" \
                --url https://grafana.com \
                --maintainer contact@grafana.com \
                --description Grafana \
                --license AGPLv3 \
                --after-install /src/packaging/deb/control/postinst \
                --before-remove /src/packaging/deb/control/prerm \
                --config-files /etc/grafana \
                --config-files /etc/default/grafana-server \
                --package /output/ \
                .
            '
          ls -la grafana-deb/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: grafana-deb
          path: grafana-deb/*.deb
          retention-days: 5

  build-rsct:
    runs-on: ubuntu-latest
    outputs:
      rsct: ${{ steps.resolve.outputs.rsct }}
      drm: ${{ steps.resolve.outputs.drm }}
    steps:
      - name: Resolve current RSCT + dynamicrm versions from the PPA
        id: resolve
        shell: bash
        run: |
          set -euo pipefail
          # The ibmpackages/rsct PPA only retains the current version in pool/, so a
          # pinned .dsc 404s on every IBM update. Resolve the latest Published version
          # from the Launchpad API instead of pinning.
          latest() {
            curl -fsS --max-time 30 \
              "https://api.launchpad.net/devel/~ibmpackages/+archive/ubuntu/rsct?ws.op=getPublishedSources&source_name=$1&exact_match=true&status=Published" \
              | python3 -c "import sys,json; print('\n'.join(e['source_package_version'] for e in json.load(sys.stdin)['entries']))" \
              | sort -V | tail -1
          }
          RSCT="$(latest rsct.core)"; RSCT="${RSCT%-0}"   # strip Debian revision (-0)
          DRM="$(latest dynamicrm)"
          [ -n "$RSCT" ] && [ -n "$DRM" ] || { echo "RSCT/dynamicrm version resolution failed"; exit 1; }
          echo "Resolved RSCT=$RSCT  DRM=$DRM"
          echo "rsct=$RSCT" >> "$GITHUB_OUTPUT"
          echo "drm=$DRM" >> "$GITHUB_OUTPUT"

      - name: Cache RSCT debs
        id: cache
        uses: actions/cache@v5
        with:
          path: rsct-debs
          key: rsct-ppc64le-${{ steps.resolve.outputs.rsct }}-${{ steps.resolve.outputs.drm }}-deb

      - name: Rebuild RSCT deb-src packages for Debian
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p rsct-debs
          docker run --rm \
            -v "${{ github.workspace }}/rsct-debs:/output" \
            debian:trixie \
            bash -c '
              set -ex
              apt-get update && apt-get install -y --no-install-recommends \
                build-essential fakeroot debhelper devscripts dpkg-dev ca-certificates curl binutils-powerpc64le-linux-gnu

              PPA=https://ppa.launchpadcontent.net/ibmpackages/rsct/ubuntu/pool/main
              RSCT_VER=${{ steps.resolve.outputs.rsct }}
              DRM_PPA_VER=${{ steps.resolve.outputs.drm }}

              mkdir -p /build && cd /build

              for pkg in rsct.core rsct.core.utils rsct.basic rsct.opt.storagerm; do
                letter=${pkg:0:1}
                dget -u "${PPA}/${letter}/${pkg}/${pkg}_${RSCT_VER}-0.dsc"
                cd ${pkg}-${RSCT_VER}/
                dpkg-buildpackage -us -uc -b -d -a ppc64el
                cd /build
              done

              dget -u "${PPA}/d/devices.chrp.base.servicerm/devices.chrp.base.servicerm_${RSCT_VER}-0.dsc"
              cd devices.chrp.base.servicerm-${RSCT_VER}/
              dpkg-buildpackage -us -uc -b -d -a ppc64el
              cd /build

              dget -u "${PPA}/s/src/src_${RSCT_VER}-0.dsc"
              cd src-${RSCT_VER}/
              dpkg-buildpackage -us -uc -b -d -a ppc64el
              cd /build

              dget -u "${PPA}/d/dynamicrm/dynamicrm_${DRM_PPA_VER}.dsc"
              cd dynamicrm-*/
              sed -i "s/1ubuntu1/1/g" debian/changelog
              dpkg-buildpackage -us -uc -b -d -a ppc64el
              cd /build

              cp /build/*.deb /output/
            '
          ls -la rsct-debs/

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: rsct-debs
          path: rsct-debs/*.deb
          retention-days: 5

  publish:
    needs:
      - build-proxysql
      - build-grpcio
      - build-crypto-wheels
      - build-manylinux-wheel
      - build-pynacl-wheel
      - build-uwsgi-proton-wheels
      - build-py-radix-wheel
      - build-cross-compiled-wheels
      - build-numpy-wheel
      - build-pyzmq-wheel
      - build-magnum-cluster-api-wheel
      - build-lego
      - build-cadvisor
      - build-openstack-exporter
      - build-openstack-network-exporter
      - build-mtail
      - build-libvirt-exporter
      - download-opflex
      - build-fluent-package
      - build-opensearch
      - build-opensearch-dashboards
      - build-grafana
      - build-rsct
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts

      - name: Build Pages directory
        run: |
          set -ex
          SITE=site
          mkdir -p $SITE/ppc64le/apt $SITE/ppc64le/simple $SITE/ppc64le/tarballs

          cp docker/base/kolla-ppc64le-repo-key.asc $SITE/ppc64le/repo-key.asc

          # --- apt repo ---
          cp artifacts/proxysql-deb/*.deb $SITE/ppc64le/apt/
          cp artifacts/fluent-package-deb/*.deb $SITE/ppc64le/apt/
          cp artifacts/opensearch-deb/*.deb $SITE/ppc64le/apt/
          cp artifacts/opensearch-dashboards-deb/*.deb $SITE/ppc64le/apt/
          cp artifacts/grafana-deb/*.deb $SITE/ppc64le/apt/
          cp artifacts/rsct-debs/*.deb $SITE/ppc64le/apt/
          cd $SITE/ppc64le/apt
          dpkg-scanpackages . /dev/null > Packages
          gzip -k Packages
          apt-ftparchive release . > Release
          cd ${{ github.workspace }}

          # GPG sign
          echo "${{ secrets.PPC64LE_REPO_GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          gpg --batch --yes --clearsign -o $SITE/ppc64le/apt/InRelease $SITE/ppc64le/apt/Release

          # --- install instructions (https://77997.github.io/kolla/ppc64le/) ---
          # Rendered from the freshly generated Packages index so the advertised
          # versions can never drift from what the apt repo actually serves.
          BUILT="$(date -u '+%Y-%m-%d %H:%M UTC')"
          FPR="$(gpg --show-keys --with-colons docker/base/kolla-ppc64le-repo-key.asc \
                 | awk -F: '/^fpr:/ {print $10; exit}' \
                 | sed -E 's/(.{4})/\1 /g; s/ $//')"
          python3 - "$SITE" "$BUILT" "$FPR" <<'PY'
          import html
          import sys

          site, built, fpr = sys.argv[1], sys.argv[2], sys.argv[3]

          ROW = ('    <tr><td><a href="apt/{deb}">{name}</a></td>'
                 '<td class="v">{ver}</td><td>{desc}</td>'
                 '<td class="sz">{size:.1f} MiB</td></tr>')

          with open(f"{site}/ppc64le/apt/Packages", encoding="utf-8") as fh:
              stanzas = fh.read().strip().split("\n\n")

          rows = []
          for stanza in stanzas:
              fields = {}
              for line in stanza.splitlines():
                  if line[:1] in (" ", "\t"):   # folded continuation of Description
                      continue
                  key, _, value = line.partition(":")
                  fields[key] = value.strip()
              if "Package" not in fields:
                  continue
              rows.append((fields["Package"], ROW.format(
                  deb=html.escape(fields.get("Filename", "").removeprefix("./")),
                  name=html.escape(fields["Package"]),
                  ver=html.escape(fields.get("Version", "")),
                  desc=html.escape(fields.get("Description", "")),
                  size=int(fields.get("Size", 0)) / 1048576.0,
              )))

          with open("docker/base/ppc64le-repo-index.html", encoding="utf-8") as fh:
              page = fh.read()
          for placeholder, value in (
              ("<!--PACKAGE_TABLE-->", "\n".join(row for _, row in sorted(rows))),
              ("<!--FINGERPRINT-->", html.escape(fpr)),
              ("<!--BUILT-->", html.escape(built)),
          ):
              if placeholder not in page:
                  raise SystemExit(f"{placeholder} missing from ppc64le-repo-index.html")
              page = page.replace(placeholder, value)

          with open(f"{site}/ppc64le/index.html", "w", encoding="utf-8") as fh:
              fh.write(page)
          PY

          # Site root redirects to the one architecture we publish.
          cat > $SITE/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="refresh" content="0; url=ppc64le/">
          <title>Kolla ppc64le dependency repository</title>
          </head>
          <body><p><a href="ppc64le/">Kolla ppc64le dependency repository</a></p></body>
          </html>
          EOF

          # --- pip index ---
          generate_pip_index() {
            local pkg_name=$1
            local pkg_dir=$SITE/ppc64le/simple/$pkg_name
            mkdir -p "$pkg_dir"
            local index="$pkg_dir/index.html"
            echo "<!DOCTYPE html><html><body>" > "$index"
            for whl in "$pkg_dir"/*.whl; do
              [ -f "$whl" ] || continue
              local fname=$(basename "$whl")
              local sha=$(sha256sum "$whl" | cut -d' ' -f1)
              echo "<a href=\"${fname}#sha256=${sha}\">${fname}</a><br/>" >> "$index"
            done
            echo "</body></html>" >> "$index"
          }

          # cryptography + bcrypt (multi-wheel artifact, needs filename-based routing)
          for pkg in cryptography bcrypt; do
            mkdir -p $SITE/ppc64le/simple/$pkg
          done
          for whl in artifacts/crypto-wheels/*.whl; do
            [ -f "$whl" ] || continue
            fname=$(basename "$whl")
            pkg_name=$(echo "$fname" | cut -d'-' -f1 | tr '[:upper:]' '[:lower:]')
            cp "$whl" "$SITE/ppc64le/simple/$pkg_name/"
          done
          generate_pip_index cryptography
          generate_pip_index bcrypt

          # uwsgi + python-qpid-proton (multi-wheel artifact, needs filename-based routing)
          for pkg in uwsgi python-qpid-proton; do
            mkdir -p "$SITE/ppc64le/simple/$pkg"
          done
          for whl in artifacts/uwsgi-proton-wheels/*.whl; do
            [ -f "$whl" ] || continue
            fname=$(basename "$whl")
            pkg_name=$(echo "$fname" | cut -d'-' -f1 | tr '[:upper:]' '[:lower:]' | sed 's/_/-/g')
            mkdir -p "$SITE/ppc64le/simple/$pkg_name"
            cp "$whl" "$SITE/ppc64le/simple/$pkg_name/"
          done
          generate_pip_index uwsgi
          generate_pip_index python-qpid-proton

          # Per-package artifacts (manylinux, cross-compiled, and standalone wheel jobs)
          for pkg in pyyaml markupsafe msgpack wrapt psutil pyrsistent netifaces tornado sysv-ipc ujson \
                     pillow psycopg2 grpcio pynacl py-radix numpy pyzmq \
                     libsass zstd lz4 ruamel-yaml-clib yappi \
                     python-ldap scrypt rcssmin rjsmin immutables zeroconf gssapi krb5 magnum-cluster-api; do
            mkdir -p "$SITE/ppc64le/simple/$pkg"
            cp artifacts/${pkg}-wheel/*.whl "$SITE/ppc64le/simple/$pkg/" 2>/dev/null || true
            generate_pip_index "$pkg"
          done

          # Root index
          echo '<!DOCTYPE html><html><body>' > $SITE/ppc64le/simple/index.html
          for d in $SITE/ppc64le/simple/*/; do
            name=$(basename "$d")
            echo "<a href=\"${name}/\">${name}</a><br/>" >> $SITE/ppc64le/simple/index.html
          done
          echo '</body></html>' >> $SITE/ppc64le/simple/index.html

          # --- tarballs ---
          cp artifacts/opflex-binaries-combined/*.tar.gz $SITE/ppc64le/tarballs/
          cp artifacts/lego-binary/* $SITE/ppc64le/tarballs/
          cp artifacts/cadvisor-binary/* $SITE/ppc64le/tarballs/
          cp artifacts/openstack-exporter-binary/* $SITE/ppc64le/tarballs/
          cp artifacts/openstack-network-exporter-binary/* $SITE/ppc64le/tarballs/
          cp artifacts/mtail-binary/* $SITE/ppc64le/tarballs/
          cp artifacts/libvirt-exporter-binary/* $SITE/ppc64le/tarballs/

          # Pages has no directory autoindex, so the landing page's tarballs/ link needs one.
          echo '<!DOCTYPE html><html><body>' > $SITE/ppc64le/tarballs/index.html
          for f in $SITE/ppc64le/tarballs/*; do
            name=$(basename "$f")
            [ "$name" = "index.html" ] && continue
            echo "<a href=\"${name}\">${name}</a><br/>" >> $SITE/ppc64le/tarballs/index.html
          done
          echo '</body></html>' >> $SITE/ppc64le/tarballs/index.html

          echo "=== Pages site contents ==="
          find $SITE -type f | sort

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ppc64le-deps/$(date +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          BODY="ProxySQL ${{ env.PROXYSQL_VERSION }}, grpcio ${{ env.GRPCIO_VERSION }}, "
          BODY+="cryptography ${{ env.CRYPTOGRAPHY_VERSION }}, bcrypt ${{ env.BCRYPT_VERSION }}, "
          BODY+="OpFlex (from 77997/opflex release), "
          BODY+="OpenSearch ${{ env.OPENSEARCH_VERSION }}, OpenSearch Dashboards ${{ env.OPENSEARCH_DASHBOARDS_VERSION }}, lego ${{ env.LEGO_VERSION }}, "
          BODY+="cadvisor ${{ env.CADVISOR_VERSION }}, openstack-exporter ${{ env.OPENSTACK_EXPORTER_VERSION }}, "
          BODY+="fluent-package ${{ env.FLUENT_PACKAGE_VERSION }}, "
          BODY+="mtail ${{ env.MTAIL_VERSION }}, libvirt-exporter ${{ env.LIBVIRT_EXPORTER_VERSION }}, "
          BODY+="pillow ${{ env.PILLOW_VERSION }}, py-radix ${{ env.PYRADIX_VERSION }}, "
          BODY+="PyYAML ${{ env.PYYAML_VERSION }}, MarkupSafe ${{ env.MARKUPSAFE_VERSION }}, "
          BODY+="msgpack ${{ env.MSGPACK_VERSION }}, wrapt ${{ env.WRAPT_VERSION }}, "
          BODY+="psutil ${{ env.PSUTIL_VERSION }}, pyrsistent ${{ env.PYRSISTENT_VERSION }}, "
          BODY+="netifaces ${{ env.NETIFACES_VERSION }}, PyNaCl ${{ env.PYNACL_VERSION }}, "
          BODY+="uwsgi ${{ env.UWSGI_VERSION }}, python-qpid-proton ${{ env.PROTON_VERSION }}, "
          BODY+="psycopg2 ${{ env.PSYCOPG2_VERSION }}, sysv_ipc ${{ env.SYSV_IPC_VERSION }}, "
          BODY+="tornado ${{ env.TORNADO_VERSION }}, ujson ${{ env.UJSON_VERSION }}, "
          BODY+="numpy ${{ env.NUMPY_VERSION }}, libsass ${{ env.LIBSASS_VERSION }}, "
          BODY+="zstd ${{ env.ZSTD_VERSION }}, lz4 ${{ env.LZ4_VERSION }}, "
          BODY+="pyzmq ${{ env.PYZMQ_VERSION }}, ruamel.yaml.clib ${{ env.RUAMEL_YAML_CLIB_VERSION }}, "
          BODY+="yappi ${{ env.YAPPI_VERSION }}, "
          BODY+="gssapi ${{ env.GSSAPI_VERSION }}, krb5 ${{ env.KRB5_VERSION }}, "
          BODY+="python-ldap ${{ env.PYTHON_LDAP_VERSION }}, scrypt ${{ env.SCRYPT_VERSION }}, "
          BODY+="rcssmin ${{ env.RCSSMIN_VERSION }}, rjsmin ${{ env.RJSMIN_VERSION }}, "
          BODY+="immutables ${{ env.IMMUTABLES_VERSION }}, "
          BODY+="zeroconf ${{ env.ZEROCONF_VERSION }}, magnum-cluster-api ${{ env.MAGNUM_CLUSTER_API_VERSION }}, "
          BODY+="grafana ${{ env.GRAFANA_VERSION }}, "
          BODY+="RSCT ${{ needs.build-rsct.outputs.rsct }}, dynamicrm ${{ needs.build-rsct.outputs.drm }}"

          gh release create "$TAG" \
            --title "ppc64le deps $(date +%Y-%m-%d)" \
            --notes "$BODY" \
            artifacts/proxysql-deb/*.deb \
            artifacts/fluent-package-deb/*.deb \
            artifacts/opensearch-deb/*.deb \
            artifacts/opensearch-dashboards-deb/*.deb \
            artifacts/grafana-deb/*.deb \
            artifacts/grpcio-wheel/*.whl \
            artifacts/crypto-wheels/*.whl \
            artifacts/py-radix-wheel/*.whl \
            artifacts/pyyaml-wheel/*.whl \
            artifacts/markupsafe-wheel/*.whl \
            artifacts/msgpack-wheel/*.whl \
            artifacts/wrapt-wheel/*.whl \
            artifacts/psutil-wheel/*.whl \
            artifacts/pyrsistent-wheel/*.whl \
            artifacts/netifaces-wheel/*.whl \
            artifacts/tornado-wheel/*.whl \
            artifacts/sysv-ipc-wheel/*.whl \
            artifacts/ujson-wheel/*.whl \
            artifacts/pillow-wheel/*.whl \
            artifacts/pynacl-wheel/*.whl \
            artifacts/uwsgi-proton-wheels/*.whl \
            artifacts/psycopg2-wheel/*.whl \
            artifacts/libsass-wheel/*.whl \
            artifacts/zstd-wheel/*.whl \
            artifacts/lz4-wheel/*.whl \
            artifacts/ruamel-yaml-clib-wheel/*.whl \
            artifacts/yappi-wheel/*.whl \
            artifacts/numpy-wheel/*.whl \
            artifacts/pyzmq-wheel/*.whl \
            artifacts/python-ldap-wheel/*.whl \
            artifacts/scrypt-wheel/*.whl \
            artifacts/rcssmin-wheel/*.whl \
            artifacts/rjsmin-wheel/*.whl \
            artifacts/immutables-wheel/*.whl \
            artifacts/zeroconf-wheel/*.whl \
            artifacts/gssapi-wheel/*.whl \
            artifacts/krb5-wheel/*.whl \
            artifacts/magnum-cluster-api-wheel/*.whl \
            artifacts/lego-binary/* \
            artifacts/cadvisor-binary/* \
            artifacts/openstack-exporter-binary/* \
            artifacts/mtail-binary/* \
            artifacts/libvirt-exporter-binary/* \
            artifacts/opflex-binaries-combined/*.tar.gz \
            artifacts/rsct-debs/*.deb

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
